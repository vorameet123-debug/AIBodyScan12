# AIBodyScan API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aibodyscan-api
  labels:
    app: aibodyscan
    component: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aibodyscan
      component: api
  template:
    metadata:
      labels:
        app: aibodyscan
        component: api
    spec:
      containers:
        - name: api
          image: aibodyscan/api:latest
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aibodyscan-secrets
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: aibodyscan-secrets
                  key: secret-key
            - name: REDIS_URL
              value: "redis://redis-service:6379/0"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
# API Service
apiVersion: v1
kind: Service
metadata:
  name: aibodyscan-api
spec:
  selector:
    app: aibodyscan
    component: api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aibodyscan-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - api.aibodyscan.com
      secretName: aibodyscan-tls
  rules:
    - host: api.aibodyscan.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aibodyscan-api
                port:
                  number: 80
---
# Secrets (apply separately with real values)
apiVersion: v1
kind: Secret
metadata:
  name: aibodyscan-secrets
type: Opaque
stringData:
  database-url: "postgresql://user:pass@host:5432/db"
  secret-key: "your-secret-key-here"
---
# HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aibodyscan-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aibodyscan-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
