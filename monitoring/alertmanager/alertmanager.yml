# Alertmanager Configuration for AIBodyScan

global:
  # Global settings
  resolve_timeout: 5m
  
  # SMTP settings for email alerts (configure with your SMTP server)
  # smtp_smarthost: 'smtp.gmail.com:587'
  # smtp_from: 'alerts@aibodyscan.com'
  # smtp_auth_username: 'your-email@gmail.com'
  # smtp_auth_password: 'your-app-password'

  # Slack settings (configure with your webhook URL)
  # slack_api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'

# Alert routing
route:
  # Default receiver
  receiver: 'default-receiver'
  
  # Group alerts by these labels
  group_by: ['alertname', 'service', 'severity']
  
  # Wait before sending first notification for a group
  group_wait: 30s
  
  # Wait before sending notification about new alerts in a group
  group_interval: 5m
  
  # Wait before re-sending a notification
  repeat_interval: 4h
  
  # Child routes for specific alerts
  routes:
    # Critical alerts (P1) - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 1h
      
    # Payment-related alerts
    - match:
        service: aibodyscan-payments
      receiver: 'payment-alerts'
      group_wait: 10s
      repeat_interval: 30m

    # Warning alerts
    - match:
        severity: warning
      receiver: 'warning-alerts'
      repeat_interval: 6h

# Receivers define where to send alerts
receivers:
  # Default receiver - logs only
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://localhost:8080/alerts'
        send_resolved: true

  # Critical alerts - Slack + Email
  - name: 'critical-alerts'
    # Uncomment and configure Slack
    # slack_configs:
    #   - channel: '#alerts-critical'
    #     send_resolved: true
    #     title: '{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
    #     text: '{{ .CommonAnnotations.description }}'
    #     color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
    
    # Uncomment and configure Email
    # email_configs:
    #   - to: 'oncall@aibodyscan.com'
    #     send_resolved: true
    #     headers:
    #       Subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'

  # Payment alerts
  - name: 'payment-alerts'
    # slack_configs:
    #   - channel: '#payments'
    #     send_resolved: true

  # Warning alerts
  - name: 'warning-alerts'
    # slack_configs:
    #   - channel: '#alerts'
    #     send_resolved: true

# Inhibition rules - prevent certain alerts when others are firing
inhibit_rules:
  # If critical error rate is firing, inhibit warning error rate
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']

# Templates for notification formatting
templates:
  - '/etc/alertmanager/templates/*.tmpl'
