# Promtail Configuration
# Log collector that ships logs to Loki

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # AIBodyScan API logs
  - job_name: aibodyscan-api
    static_configs:
      - targets:
          - localhost
        labels:
          job: aibodyscan-api
          environment: development
          __path__: /var/log/aibodyscan/*.log
    
    pipeline_stages:
      # Parse JSON logs
      - json:
          expressions:
            level: level
            message: message
            correlation_id: correlation_id
            logger: logger
            timestamp: timestamp
      
      # Set labels from parsed fields
      - labels:
          level:
          correlation_id:
          logger:
      
      # Parse timestamp
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      
      # Set output to message
      - output:
          source: message

  # Docker container logs (if using Docker)
  - job_name: containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
      - labels:
          level:
